function empty(s){return `<div class="empty">${s}</div>`}

function calendar(){
 let ds=dates(START,END),list=S.tasks.filter(t=>passFilter(t.paper,t.title));let selectedTasks=list.filter(t=>t.date===selected),daymin=selectedTasks.reduce((a,t)=>a+t.minutes,0),capacity=dow(selected)===5?S.preferences.friday:dow(selected)===6?S.preferences.saturday:S.preferences.sunthu;
 let cal='';if(calendarMode==='Month'){let a=month+'-01',from=plus(a,-((dow(a)+6)%7)),end=plus(from,41);cal=`<div class="calendar-wrap"><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-head">${d}</div>`).join('')}${dates(from,end).map(d=>{let ts=list.filter(t=>t.date===d),min=ts.reduce((a,t)=>a+t.minutes,0);return `<div role="button" tabindex="0" class="day ${d.slice(0,7)!==month?'outside':''} ${d===selected?'selected':''} ${d===today()?'today':''}" data-action="day" data-id="${d}"><div class="row between"><span class="daynum">${+d.slice(-2)}</span><span class="day-total">${min?hours(min)+'h':''}</span></div>${ts.slice(0,3).map(t=>`<div class="cal-event" style="--color:${color(t.paper)}">${t.done?'✓ ':''}${esc(t.paper||t.type)} · ${esc(t.title)}</div>`).join('')}${ts.length>3?`<div class="day-total">+${ts.length-3} sessions</div>`:''}${d>=START&&d<=END&&!ts.length?'<div class="day-total">Recovery / buffer</div>':''}</div>`}).join('')}</div></div>`}
 else if(calendarMode==='Week'){let from=plus(selected,-((dow(selected)+6)%7));cal=`<div class="list">${dates(from,plus(from,6)).map(d=>`<section class="panel"><h3>${fmt(d)}</h3>${list.filter(t=>t.date===d).map(taskRow).join('')||empty('No tasks')}</section>`).join('')}</div>`}
 else cal=`<div class="list">${ds.map(d=>`<details class="panel" ${d===selected?'open':''}><summary>${fmt(d)} · ${hours(list.filter(t=>t.date===d).reduce((a,t)=>a+t.minutes,0))} h</summary>${list.filter(t=>t.date===d).map(taskRow).join('')||empty('Recovery / buffer')}</details>`).join('')}</div>`;
 return tools(`<select id="calendarMode">${['Month','Week','Agenda'].map(x=>`<option ${calendarMode===x?'selected':''}>${x}</option>`).join('')}</select><input type="month" id="month" value="${month}"><input type="date" id="selectedDate" value="${selected}">`)+`<div class="row between" style="margin-bottom:16px"><div class="row"><button class="small" data-action="cal-prev">←</button><button class="small" data-action="cal-next">→</button><span>${calendarMode==='Month'?new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(month+'-01T12:00Z')):fmt(selected)}</span></div><button class="small" data-action="suggest">Review catch-up suggestions</button></div>${cal}<section class="panel section"><div class="row between"><h2>${fmt(selected)}</h2>${pill(hours(daymin)+'h planned / '+hours(capacity)+'h target')}</div>${daymin>capacity?'<div class="warning">This day is overloaded. Task estimates exceed your chosen daily capacity. Move whole learning cycles or review blocks.</div>':''}<div class="row" style="margin-bottom:12px">${Object.entries(selectedTasks.reduce((o,t)=>{if(t.sequence){for(const [k,v]of Object.entries(t.sequence))o[k]=(o[k]||0)+v}else{o[t.type]=(o[t.type]||0)+t.minutes}return o},{})).map(([k,v])=>pill(k+': '+v+' min')).join('')}</div>${selectedTasks.map(taskRow).join('')||empty('Nothing scheduled. Add a task or keep this as recovery time.')}<p class="sub">Breaks: ${S.preferences.break} minutes between focused blocks, outside study totals. Tasks are ordered within each day and have no invented clock times.</p></section>`;
}

function analytics(){let completed=S.tasks.filter(t=>t.done),actual=S.tasks.reduce((a,t)=>a+(t.actual||0),0),req=progress(S.cards),totals=S.papers.map(p=>{let a=S.attempts.filter(a=>a.paper===p.id&&a.attempt==='First'),r=S.attempts.filter(a=>a.paper===p.id&&a.attempt==='Repeat'),past=S.past.filter(a=>a.paper===p.id),sum=x=>x.length?pct(x.reduce((s,a)=>s+a.achieved,0),x.reduce((s,a)=>s+a.maximum,0))+'%':'—';return [p.id,sum(a),sum(r),sum(past),S.errors.filter(e=>e.paper===p.id&&!e.resolved).length]});return `<div class="grid stats">${stat('Sessions completed',completed.length,S.tasks.length+' scheduled')}${stat('Actual study',hours(actual)+'h','Recorded time; completion does not invent hours')}${stat('Later recall mastery',req.master,req.total+' identified recall requirements')}${stat('Unresolved errors',S.errors.filter(e=>!e.resolved).length,'Retests close the learning loop')}</div><div class="grid two"><section class="panel"><h2>Paper performance</h2><div class="table-wrap"><table><thead><tr><th>Paper</th><th>First topical</th><th>Repeat topical</th><th>Past papers</th><th>Open errors</th></tr></thead><tbody>${totals.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')}</tbody></table></div><p class="sub">Percentages aggregate marks earned/available. These are raw percentages, not UMS or predicted grades.</p></section><section class="panel"><h2>Study consistency</h2><div class="heat">${dates(START,END).map(d=>{let m=S.tasks.filter(t=>t.date===d).reduce((a,t)=>a+(t.actual||0),0);return `<div title="${d}: ${m} min" style="${m?'background:rgba(193,220,166,'+Math.min(.95,.2+m/500)+')':''}"></div>`}).join('')}</div><p class="sub">24 Oct — 5 Jan · recorded minutes per day.</p><h3 class="section">Common errors</h3>${Object.entries(S.errors.reduce((o,e)=>(o[e.category]=(o[e.category]||0)+1,o),{})).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<p class="sub">${esc(k)} · ${v}</p>`).join('')||empty('No errors logged yet.')}</section></div><section class="panel secti  for(const a of S.attempts.filter(a=>a.maximum&&a.achieved/a.maximum<.6).slice(-5)){let t=topic(a.topic);suggestions.push({id:uid('suggest'),title:'Extra practice after '+pct(a.achieved,a.maximum)+'%: '+(t?.title||a.paper),task:taskObj(target,'Corrective questions: '+(t?.title||a.paper),'Corrective revision',45,a.paper,a.topic),kind:'add',date:target})}
 for(const t of S.topics.filter(t=>t.rating>0&&t.rating<5).slice(0,4))suggestions.push({id:uid('suggest'),title:'Low-confidence review: '+t.title,task:taskObj(target,'Review & retrieve: '+t.title,'Targeted revision',t.revision,t.paper,t.id),kind:'add',date:target});
 let m=$('#modal');m.innerHTML=`<h2>Review suggested changes</h2><p class="sub">No change happens until you accept it. Target dates remain editable. Check the target day’s load before accepting.</p>${suggestions.map((s,i)=>`<div class="task"><div class="body"><div>${esc(s.title)}</div><input type="date" id="suggest-date-${i}" value="${s.date}"></div><button class="small" data-suggest="${i}">Accept</button><button class="small ghost" data-reject="${i}">Reject</button></div>`).join('')||empty('No missed tasks, low scores or weak ratings to act on.')}<button id="closeSuggestions">Close</button>`;m.showModal();$('#closeSuggestions').onclick=()=>m.close();m.querySelectorAll('[data-suggest]').forEach(b=>b.onclick=()=>{let i=+b.dataset.suggest,s=suggestions[i],d=$('#suggest-date-'+i).value;try{checkDate(d);if(d<START||d>END)throw Error('Choose a date inside the preparation window.');if(s.kind==='move'){recordChange('Accepted catch-up: '+s.title,s.task);s.task.date=d}else{recordChange('Accepted revision: '+s.title);S.tasks.push({...s.task,date:d})}save();b.closest('.task').remove();render();toast('Change accepted')}catch(e){toast(e.message)}});m.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>b.closest('.task').remove())}
function auditRef(id){let r=S.coverage.find(x=>x.id===id);openForm('Audit '+r.paper+' '+r.ref,field('topic','Map to study group',r.topic,'select',topicOpts())+field('decision','Recall / application / practice decision',r.decision,'textarea',null,true)+field('verified','Complete statement and all subpoints checked?',r.verified?'yes':'no','select',[{value:'no',label:'No — provisional'},{value:'yes',label:'Yes — personally audited'}]),d=>{if(d.topic&&topic(d.topic).paper!==r.paper)throw Error('Choose a topic in the same paper.');if(d.verified==='yes'&&(!d.topic||d.decision.length<15))throw Error('Map a topic and describe the coverage decision before auditing.');Object.assign(r,d,{verified:d.verified==='yes'})})}
function editExam(id){let p=paper(id);openForm('Examination details · '+id,field('date','Date',p.date,'date')+field('session','Session',p.session,'select',['Morning','Afternoon','Unverified'])+field('dateStatus','Verification status',p.dateStatus,'select',['Verified — official timetable','User edited — check with centre','Unverified']),d=>{checkDate(d.date);Object.assign(p,d)})}
function editPreferences(){let p=S.preferences;openForm('Daily capacity targets',field('sunthu','Sun–Thu focused minutes',p.sunthu,'number')+field('friday','Friday focused minutes',p.friday,'number')+field('saturday','Saturday focused minutes',p.saturday,'number')+field('break','Break minutes between blocks',p.break,'number'),d=>{for(const k in d)d[k]=number(d[k],k,0,1440);S.preferences=d;recordChange('Updated capacity targets; existing tasks preserved')})}
async function handleAction(el){let action=el.dataset.action,id=el.dataset.id;try{
 if(action==='nav'){page=id;search='';filter='';typeFilter='';statusFilter='';render();window.scrollTo(0,0);return}
 if(action==='paper-memory'){page='Memorisation';filter=id;search='';render();window.scrollTo(0,0);return}
 if(action==='edit-task'){editTask(id);return}if(action==='new-topic'){editTopic();return}if(action==='edit-topic'){editTopic(id);return}if(action==='new-card'){editCard();return}if(action==='edit-card'){editCard(id);return}
 if(['new-attempts','edit-attempts','new-past','edit-past'].includes(action)){editAttempt(action.endsWith('past')?'past':'attempts',id);return}
 if(action==='new-error'||action==='edit-error'){editError(id);return}
 if(action==='day'){selected=id;render();return}if(action==='cal-prev'||action==='cal-next'){let n=action==='cal-prev'?-1:1;if(calendarMode==='Month'){let d=new Date(month+'-15T12:00Z');d.setUTCMonth(d.getUTCMonth()+n);month=d.toISOString().slice(0,7)}else{selected=plus(selected,n*7);month=selected.slice(0,7)}render();return}
 if(action==='backup'){backup();return}if(action==='csv'){exportCSV(id);return}
 if(action==='import'){$('#importFile').click();return}
 if(action==='download-html'){let html='<!doctype html>\n'+document.documentElement.outerHTML;download('index.html',html,'text/html');toast('App downloaded. Progress is separate; export JSON too.');return}
 if(action==='reset'){if(prompt('Export a backup first. Type RESET to erase all progress and restore the original plan.')==='RESET'){recordChange('Reset requested');S=fresh();save();render();toast('Reset complete')}return}
 if(action==='suggest'){showSuggestions();return}if(action==='audit-ref'){auditRef(id);return}if(action==='edit-exam'){editExam(id);return}if(action==='preferences'){editPreferences();return}
 if(action==='complete-topic'){let t=topic(id);if(!canComplete(id))throw Error('Complete a learning cycle and save a topical attempt marked “Marked & corrected” first.');t.status='Learned + practised';t.firstLearned=t.firstLearned||today()}
 if(action==='initial'){let c=S.cards.find(x=>x.id===id);c.initial=!c.initial;if(c.initial){c.initialDate=today();c.next=plus(today(),1)}else{c.initialDate='';c.next='';c.history=[]}}
 if(action==='recall'){let c=S.cards.find(x=>x.id===id);let n=recallCard(c,+el.dataset.score);toast('Recall saved · next review in '+n+' day'+(n===1?'':'s'))}
 if(action==='flag-card'){let c=S.cards.find(x=>x.id===id);c.flag=!c.flag}
 if(action==='schedule-error'){let e=S.errors.find(x=>x.id===id),d=e.retest||selected;checkDate(d);if(!confirm('Add a 30-minute closed-book retest on '+fmt(d)+'?'))return;S.tasks.push(taskObj(d,'Retest: '+e.category,'Corrective revision',30,e.paper,e.topic,{error:e.id}));e.retest=d;recordChange('Scheduled error retest '+e.id)}
 if(action==='pass-error'){let e=S.errors.find(x=>x.id===id);if(today()<=e.date)throw Error('Record the successful retest on a later date.');if(confirm('Did you independently answer correctly, closed-book, on this later date?')){e.resolved=true;e.result='Passed independently on '+today()}}
 save();render()
 }catch(e){toast(e.message)}
}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el)handleAction(el)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.day[data-action]')){e.preventDefault();handleAction(e.target)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let pos=e.target.selectionStart;search=e.target.value;render();let input=$('#search');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{let el=e.target;
 try{if(el.dataset.task){let t=S.tasks.find(x=>x.id===el.dataset.task);t.done=el.checked;if(t.done&&t.topic&&topic(t.topic)){let top=topic(t.topic);if(t.type==='Learning cycle'&&top.status==='Not started')top.status='Awaiting topical practice';if(t.type==='Spaced revision')top.lastRevised=today()}save();render()}
 if(el.dataset.rating){let t=topic(el.dataset.rating);t.rating=number(el.value,'understanding',1,10);t.history.push({date:today(),rating:t.rating});save();render()}
 if(el.id==='paperFilter'){filter=el.value;render()}if(el.id==='typeFilter'){typeFilter=el.value;render()}if(el.id==='statusFilter'){statusFilter=el.value;render()}if(el.id==='calendarMode'){calendarMode=el.value;render()}if(el.id==='month'){month=el.value;selected=month+'-01';render()}if(el.id==='selectedDate'){selected=el.value;month=selected.slice(0,7);render()}
 if(el.id==='importFile'&&el.files[0]){let f=el.files[0];if(f.size>20000000)throw Error('Backup is too large (20 MB limit).');let incoming=JSON.parse(await f.text());validate(incoming);if(confirm('Validated backup: '+incoming.tasks.length+' tasks, '+incoming.cards.length+' cards. Replace all current data? Export a backup first if needed.')){S=incoming;save();render();toast('Backup restored')}el.value=''}
 }catch(err){toast('Could not apply change: '+err.message);if(el.id==='importFile')el.value=''}
});
$('#backupTop').onclick=backup;$('#addTop').onclick=()=>editTask();render();
</script></body></html>
