function editPast(id){let a=S.past.find(x=>x.id===id)||{id:uid('past'),paper:filter||'WCH11',date:today(),session:'January',year:'',achieved:0,maximum:paper(filter||'WCH11').marks,minutes:0,marking:'Not marked',attempt:'First',notes:''};openForm(id?'Edit paper result':'Log a past paper',field('paper','Paper',a.paper,'select',S.papers.map(p=>p.id))+field('date','Date',a.date,'date')+field('session','Exam session',a.session,'select',['January','June','October','Other'])+field('year','Exam year',a.year,'number')+field('achieved','Marks achieved',a.achieved,'number')+field('maximum','Total marks',a.maximum,'number')+field('minutes','Time taken (minutes)',a.minutes,'number')+field('marking','Marking status',a.marking,'select',['Not marked','Partly marked','Marked','Marked & corrected'])+field('attempt','Attempt',a.attempt,'select',['First','Repeat'])+field('notes','Notes (optional)',a.notes,'textarea',null,true),d=>{checkDate(d.date);checkPaper(d.paper);d.year=num(d.year,'Exam year',2000,2100);d.maximum=num(d.maximum,'Total marks',1,1000);d.achieved=num(d.achieved,'Marks achieved',0,d.maximum);d.minutes=num(d.minutes,'Time taken',0,1440);Object.assign(a,d);if(!id)S.past.push(a)},id?()=>S.past=S.past.filter(x=>x.id!==id):null,()=>{const sel=$('#editor select[name="paper"]');sel.onchange=()=>{const p=paper(sel.value);$('#editor input[name="maximum"]').value=p.marks}})}
function editError(id){let e=S.errors.find(x=>x.id===id)||{id:uid('error'),paper:filter||'WCH11',topic:'',question:'',correction:'',notes:'',date:today()};openForm(id?'Edit correction':'Add an error correction',field('paper','Paper',e.paper,'select',S.papers.map(p=>p.id))+field('topic','Topic',e.topic)+field('question','Question',e.question,'textarea',null,true)+field('correction','Correction',e.correction,'textarea',null,true)+field('notes','Notes',e.notes,'textarea',null,true)+field('date','Date',e.date,'date'),d=>{checkDate(d.date);checkPaper(d.paper);Object.assign(e,d);if(!id)S.errors.push(e)},id?()=>S.errors=S.errors.filter(x=>x.id!==id):null)}
function editFormula(id){let f=S.formulas.find(x=>x.id===id)||{id:uid('formula'),papers:[filter||'WPH11'],title:'',latex:'',answer:'',supply:'Check formula booklet',status:'User added',history:[],initial:false,next:'',notes:''};openForm(id?'Edit formula':'Add formula',field('title','Recall prompt',f.title)+field('papers','Paper codes (comma separated)',f.papers.join(','))+field('latex','Formula (LaTeX)',f.latex,'textarea',null,true)+field('answer','Symbols, units and conditions',f.answer,'textarea',null,true)+field('supply','Availability / supplied status',f.supply)+field('notes','Notes',f.notes,'textarea',null,true),d=>{const ps=[...new Set(d.papers.split(',').map(x=>x.trim()).filter(Boolean))];if(!ps.length)throw Error('Add at least one paper code.');ps.forEach(p=>checkPaper(p));if(!d.latex.trim())throw Error('Add the formula.');Object.assign(f,d,{papers:ps});if(!id)S.formulas.push(f)})}
function recall(f,score){if(!f.initial){f.initial=true;f.initialDate=today()}const n=f.history.filter(h=>h.score>=2).length,interval=score===0?1:score===1?2:score===2?[3,7,14,30,60][Math.min(n,4)]:[7,14,30,60,90][Math.min(n,4)];f.history.push({id:uid('recall'),date:today(),score});f.next=plus(today(),interval);return interval}
function download(name,body,mime='application/json'){let u=URL.createObjectURL(new Blob([body],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function backup(){download('Atlas-backup-'+today()+'.json',JSON.stringify(S,null,2))}
function csvValue(v){let s=typeof v==='object'?JSON.stringify(v):String(v??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csv(key){let rows=S[key],keys=[...new Set(rows.flatMap(Object.keys))];download('Atlas-'+key+'.csv','\uFEFF'+keys.map(csvValue).join(',')+'\r\n'+rows.map(r=>keys.map(k=>csvValue(r[k])).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function validate(s){if(!s||s.version!==2)throw Error('Unsupported backup version.');for(const k of ['papers','topics','formulas','tasks','past','errors','changes']){if(!Array.isArray(s[k])||s[k].length>25000)throw Error('Invalid '+k);let ids=new Set();for(const x of s[k]){if(!x||typeof x!=='object')throw Error('Invalid '+k+' record');if(k!=='changes'){if(typeof x.id!=='string'||/[\s"'<>`&]/.test(x.id)||ids.has(x.id))throw Error('Invalid/duplicate ID in '+k);ids.add(x.id)}}}const has=(k,id)=>s[k].some(x=>x.id===id);if(s.papers.length!==9||!SEED.papers.every(p=>has('papers',p.id)))throw Error('All nine papers must remain.');if(!s.books||typeof s.formulaNote!=='string')throw Error('Missing academic metadata.');for(const t of s.topics){if(!has('papers',t.paper)||!s.books[t.book]||typeof t.title!=='string'||!Array.isArray(t.lessons))throw Error('Invalid SME IAL topic');num(t.rating,'Rating',0,10)}for(const t of s.tasks){checkDate(t.date);if((t.paper&&!has('papers',t.paper))||(t.topic&&!has('topics',t.topic))||typeof t.title!=='string'||typeof t.done!=='boolean')throw Error('Invalid goal reference');}for(const f of s.formulas){if(!Array.isArray(f.papers)||!f.papers.length||f.papers.some(p=>!has('papers',p))||!Array.isArray(f.history)||typeof f.latex!=='string'||typeof f.title!=='string')throw Error('Invalid formula');if(f.next)checkDate(f.next);for(const h of f.history){checkDate(h.date);num(h.score,'Recall score',0,3)}}for(const a of s.past){checkDate(a.date);if(!has('papers',a.paper))throw Error('Invalid paper log');num(a.maximum,'Total marks',1,1000);num(a.achieved,'Marks achieved',0,a.maximum);num(a.minutes,'Time taken',0,1440)}for(const e of s.errors){checkDate(e.date);if(!has('papers',e.paper)||typeof e.question!=='string'||typeof e.correction!=='string')throw Error('Invalid error log')}for(const b of Object.values(s.books)){if(typeof b.url!=='string'||!['https://www.pearson.com/','https://www.savemyexams.com/international-a-level/'].some(prefix=>b.url.startsWith(prefix)))throw Error('Invalid course reference')}return true}
function catchup(){let cutoff=today()<START?START:today()>END?END:today(),missed=S.tasks.filter(t=>!t.done&&t.date<cutoff),m=$('#modal');m.innerHTML=`<h2>Unfinished goals</h2><p class="sub">Move a whole study/practice pair together to keep questions immediately after learning. No changes happen until accepted.</p>${missed.slice(0,25).map((t,i)=>`<div class="task"><div class="body"><strong>${esc(t.title)}</strong><div class="sub">${fmt(t.date)}</div><input type="date" id="move-${i}" value="${cutoff}"></div><button class="small" data-move="${esc(t.id)}" data-index="${i}">Move</button></div>`).join('')||empty('No missed goals yet.')}<button id="closeCatchup">Close</button>`;m.showModal();$('#closeCatchup').onclick=()=>m.close();m.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{try{let t=S.tasks.find(t=>t.id===b.dataset.move),d=$('#move-'+b.dataset.index).value;checkDate(d);let pair=t.core?S.tasks.filter(x=>x.topic===t.topic&&x.part===t.part&&!x.done):[t];for(const x of pair){change('Rescheduled: '+x.title,x);x.date=d}save();m.close();render();toast('Goals rescheduled')}catch(e){toast(e.message)}})}
async function action(el){const a=el.dataset.action,id=el.dataset.id;try{
 if(a==='nav'){page=id;filter='';search='';render();window.scrollTo(0,0);return}
 if(a==='paper-calendar'){page='Calendar';filter=id;search='';selected=S.tasks.filter(t=>t.paper===id).sort((a,b)=>a.date.localeCompare(b.date))[0]?.date||START;month=selected.slice(0,7);render();return}
 if(a==='day'||a==='go-day'){page='Calendar';selected=id;month=id.slice(0,7);render();return}
 if(a==='view-topic'){page='Topics';search=topic(id)?.title||'';filter=S.topics.find(t=>t.id===id)?.paper||'';render();return}
 if(a==='topic-calendar'){page='Calendar';search=topic(id)?.title||'';filter=topic(id)?.paper||'';selected=S.tasks.find(t=>t.topic===id)?.date||START;month=selected.slice(0,7);render();return}
 if(a==='edit-task'){editTask(id);return}if(a==='edit-topic'){editTopic(id);return}if(a==='new-past'||a==='edit-past'){editPast(id);return}if(a==='new-error'||a==='edit-error'){editError(id);return}if(a==='new-formula'||a==='edit-formula'){editFormula(id);return}
 if(a==='cal-prev'||a==='cal-next'){let n=a==='cal-prev'?-1:1;if(mode==='Month'){let d=new Date(month+'-15T12:00Z');d.setUTCMonth(d.getUTCMonth()+n);month=d.toISOString().slice(0,7);selected=month+'-01'}else selected=plus(selected,n*7);render();return}
 if(a==='formula-due'){dueOnly=!dueOnly;render();return}if(a==='formula-reveal'){revealed.has(id)?revealed.delete(id):revealed.add(id);render();return}if(a==='formula-initial'){const f=S.formulas.find(x=>x.id===id);f.initial=!f.initial;if(f.initial){f.initialDate=today();f.next=plus(today(),1)}else f.next=''}
 if(a==='formula-recall'){let n=recall(S.formulas.find(x=>x.id===id),Number(el.dataset.score));revealed.delete(id);toast('Recall saved. Next review in '+n+' days.')}
 if(a==='backup'){backup();return}if(a==='archive'){download('Atlas-previous-version.json',JSON.stringify(S.archive,null,2));return}if(a==='csv'){csv(id);return}if(a==='import'){$('#importFile').click();return}if(a==='catchup'){catchup();return}
 if(a==='reset'){if(prompt('Type RESET to restore the original goals and erase this version’s progress. Export a backup first.')==='RESET'){S=fresh();save();render();toast('Planner reset')}return}
 save();render()
 }catch(e){toast(e.message)}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)action(el)});document.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.matches('.day[data-action]')){e.preventDefault();action(e.target)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let n=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(n,n)}});
document.addEventListener('change',async e=>{let el=e.target;try{
 if(el.dataset.task){let t=S.tasks.find(t=>t.id===el.dataset.task);t.done=el.checked;t.completedDate=t.done?today():'';save();render()}
 if(el.dataset.rating){let t=topic(el.dataset.rating);t.rating=num(el.value,'Understanding',1,10);save()}
 if(el.id==='paperFilter'){filter=el.value;render()}if(el.id==='calendarMode'){mode=el.value;render()}if(el.id==='month'){month=el.value;selected=month+'-01';render()}if(el.id==='selectedDate'){checkDate(el.value);selected=el.value;month=selected.slice(0,7);render()}
 if(el.id==='importFile'&&el.files[0]){if(el.files[0].size>25000000)throw Error('Backup exceeds 25 MB.');let data=JSON.parse(await el.files[0].text());if(data.version===1){if(!Array.isArray(data.papers)||!Array.isArray(data.tasks)||!Array.isArray(data.cards))throw Error('Invalid version 1 backup');data=migrate(data)}validate(data);upgradePlan(data);if(confirm('Validated backup. Replace this version’s current goals, formula progress and logs?')){S=data;save();render();toast('Backup restored')}el.value=''}
 }catch(err){toast('Could not apply: '+err.message);if(el.id==='importFile')el.value=''}});
$('#addTop').onclick=()=>editTask();$('#backupTop').onclick=backup;render();
</script></body></html>
